name: Schedule — Reclaim & Rise Now

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date for Day 1 (must be a Monday, format YYYY-MM-DD)"
        required: true
        type: string
      dry_run:
        description: "Dry run — preview posts without sending to Publer"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  schedule-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Schedule posts to Publer
        env:
          PUBLER_API_KEY: ${{ secrets.PUBLER_API_KEY }}
          PUBLER_WORKSPACE_ID: ${{ secrets.PUBLER_WORKSPACE_ID }}
        run: |
          PROFILE_ARGS="ig:${{ secrets.PUBLER_PROFILE_RECLAIM_IG }}"
          if [ -n "${{ secrets.PUBLER_PROFILE_RECLAIM_YT }}" ]; then
            PROFILE_ARGS="$PROFILE_ARGS yt:${{ secrets.PUBLER_PROFILE_RECLAIM_YT }}"
          fi

          python scripts/schedule_posts.py \
            --brand reclaim \
            --start-date "${{ inputs.start_date }}" \
            --api-key "$PUBLER_API_KEY" \
            --workspace-id "$PUBLER_WORKSPACE_ID" \
            --profile-ids $PROFILE_ARGS \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
