name: Schedule — Revitalize & Thrive Now

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date for Day 1 (must be a Monday, format YYYY-MM-DD)"
        required: true
        type: string
      dry_run:
        description: "Dry run — preview posts without sending to Publer"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  schedule-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Schedule posts to Publer
        env:
          PUBLER_API_KEY: ${{ secrets.PUBLER_API_KEY }}
        run: |
          python scripts/schedule_posts.py \
            --brand revitalize \
            --start-date "${{ inputs.start_date }}" \
            --api-key "$PUBLER_API_KEY" \
            --profile-ids ig:${{ secrets.PUBLER_PROFILE_REVITALIZE_IG }} \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
